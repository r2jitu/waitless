<text x="142" y="178" font-size="13" font-weight="700" fill="#6aa84f">Waitless (4 vCPU)</text>
<polyline points="162.4,397.3 234.8,394.6 307.1,392.1 379.5,384.8 451.9,381.8 524.3,196.7 596.7,154.3" fill="none" stroke="#9aa0ae" stroke-width="2.5" stroke-linejoin="round"/>
