<circle cx="234.8" cy="394.6" r="3.5" fill="#9aa0ae"/>
<circle cx="307.1" cy="392.1" r="3.5" fill="#9aa0ae"/>
<circle cx="379.5" cy="384.8" r="3.5" fill="#9aa0ae"/>
<circle cx="451.9" cy="381.8" r="3.5" fill="#9aa0ae"/>
<circle cx="524.3" cy="196.7" r="3.5" fill="#9aa0ae"/>
<circle cx="596.7" cy="154.3" r="4" fill="#ffffff" stroke="#9aa0ae" stroke-width="2"/>
<line x1="106" y1="196" x2="134" y2="196" stroke="#9aa0ae" stroke-width="2.5"/>
<text x="142" y="200" font-size="13" font-weight="700" fill="#9aa0ae">tokio-hyper (8 vCPU)</text>
<text x="846" y="152" text-anchor="end" font-size="12" fill="#5a5a72">hollow markers = offered rate not met (backlogged)</text>
<text x="40" y="486" font-size="12" fill="#5a5a72">8-vCPU Waitless meets every offered rate through 800 K req/s with p99 ≤ 11 ms; tokio-hyper saturates between 500 K and 600 K.</text>
<text x="40" y="504" font-size="12" fill="#5a5a72">4-vCPU Waitless meets 600 K at p99 3.6 ms — more than 8-vCPU tokio-hyper can serve: half the hardware, more capacity.</text>
<text x="40" y="522" font-size="12" fill="#5a5a72">Same GCE c3 VMs, gVNIC, byte-identical TLS /health, measured back-to-back with a first-party open-loop loadgen</text>
<text x="40" y="540" font-size="12" fill="#5a5a72">(scripts/bench/loadgen, http-rate). Raw data in docs/assets/bench-2026-06-11/.</text>
</svg>
