<text x="813.8" y="442" text-anchor="middle" font-size="12" fill="#5a5a72">1000K</text>
<text x="470.0" y="464" text-anchor="middle" font-size="13" fill="#3a3a4a">offered load (requests / second)</text>
<text x="40" y="130" font-size="13" font-weight="700" fill="#3a3a4a">p99 latency, log scale (lower is better)</text>
<polyline points="162.4,398.0 234.8,394.9 307.1,393.4 379.5,388.9 451.9,387.1 524.3,382.1 596.7,359.7 669.0,349.2 741.4,192.4 813.8,156.6" fill="none" stroke="#1f7a4d" stroke-width="3.5" stroke-linejoin="round"/>
