<text x="234.8" y="442" text-anchor="middle" font-size="12" fill="#5a5a72">200K</text>
<line x1="307.1" y1="422" x2="307.1" y2="427" stroke="#3a3a4a"/>
<text x="307.1" y="442" text-anchor="middle" font-size="12" fill="#5a5a72">300K</text>
<line x1="379.5" y1="422" x2="379.5" y2="427" stroke="#3a3a4a"/>
<text x="379.5" y="442" text-anchor="middle" font-size="12" fill="#5a5a72">400K</text>
<line x1="451.9" y1="422" x2="451.9" y2="427" stroke="#3a3a4a"/>
