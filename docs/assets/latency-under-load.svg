<circle cx="669.0" cy="307.2" r="3.5" fill="#1f7a4d"/>
<circle cx="741.4" cy="150.4" r="4" fill="#ffffff" stroke="#1f7a4d" stroke-width="2"/>
<circle cx="813.8" cy="114.6" r="4" fill="#ffffff" stroke="#1f7a4d" stroke-width="2"/>
<line x1="106" y1="110" x2="134" y2="110" stroke="#1f7a4d" stroke-width="3.5"/>
<text x="142" y="114" font-size="13" font-weight="700" fill="#1f7a4d">Waitless (8 vCPU)</text>
<polyline points="162.4,355.7 234.8,352.7 307.1,351.7 379.5,348.4 451.9,343.7 524.3,341.1 596.7,133.3" fill="none" stroke="#6aa84f" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="162.4" cy="355.7" r="3.5" fill="#6aa84f"/>
<circle cx="234.8" cy="352.7" r="3.5" fill="#6aa84f"/>
<circle cx="307.1" cy="351.7" r="3.5" fill="#6aa84f"/>
<circle cx="379.5" cy="348.4" r="3.5" fill="#6aa84f"/>
<circle cx="451.9" cy="343.7" r="3.5" fill="#6aa84f"/>
<circle cx="524.3" cy="341.1" r="3.5" fill="#6aa84f"/>
<circle cx="596.7" cy="133.3" r="3.5" fill="#6aa84f"/>
<line x1="106" y1="132" x2="134" y2="132" stroke="#6aa84f" stroke-width="2.5"/>
<text x="142" y="136" font-size="13" font-weight="700" fill="#6aa84f">Waitless (4 vCPU)</text>
<polyline points="162.4,355.3 234.8,352.6 307.1,350.1 379.5,342.8 451.9,339.8 524.3,154.7 596.7,112.3" fill="none" stroke="#9aa0ae" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="162.4" cy="355.3" r="3.5" fill="#9aa0ae"/>
<circle cx="234.8" cy="352.6" r="3.5" fill="#9aa0ae"/>
<circle cx="307.1" cy="350.1" r="3.5" fill="#9aa0ae"/>
<circle cx="379.5" cy="342.8" r="3.5" fill="#9aa0ae"/>
<circle cx="451.9" cy="339.8" r="3.5" fill="#9aa0ae"/>
<circle cx="524.3" cy="154.7" r="3.5" fill="#9aa0ae"/>
<circle cx="596.7" cy="112.3" r="4" fill="#ffffff" stroke="#9aa0ae" stroke-width="2"/>
<line x1="106" y1="154" x2="134" y2="154" stroke="#9aa0ae" stroke-width="2.5"/>
<text x="142" y="158" font-size="13" font-weight="700" fill="#9aa0ae">tokio-hyper (8 vCPU)</text>
<text x="846" y="110" text-anchor="end" font-size="12" fill="#5a5a72">hollow markers = offered rate not met (backlogged)</text>
<text x="40" y="444" font-size="12" fill="#5a5a72">8-vCPU Waitless meets every offered rate through 800 K req/s with p99 ≤ 11 ms; tokio-hyper saturates between 500 K and 600 K.</text>
<text x="40" y="462" font-size="12" fill="#5a5a72">4-vCPU Waitless meets 600 K at p99 3.6 ms — more than 8-vCPU tokio-hyper can serve: half the hardware, more capacity.</text>
<text x="40" y="480" font-size="12" fill="#5a5a72">Same GCE c3 VMs, gVNIC, byte-identical TLS /health, measured back-to-back with a first-party open-loop loadgen</text>
<text x="40" y="498" font-size="12" fill="#5a5a72">(scripts/bench/loadgen, http-rate). Raw data in docs/assets/bench-2026-06-11/.</text>
</svg>
