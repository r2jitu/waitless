<text x="524.3" y="442" text-anchor="middle" font-size="12" fill="#5a5a72">600K</text>
<line x1="596.7" y1="422" x2="596.7" y2="427" stroke="#3a3a4a"/>
<text x="596.7" y="442" text-anchor="middle" font-size="12" fill="#5a5a72">700K</text>
<line x1="669.0" y1="422" x2="669.0" y2="427" stroke="#3a3a4a"/>
<text x="669.0" y="442" text-anchor="middle" font-size="12" fill="#5a5a72">800K</text>
<line x1="741.4" y1="422" x2="741.4" y2="427" stroke="#3a3a4a"/>
<text x="741.4" y="442" text-anchor="middle" font-size="12" fill="#5a5a72">900K</text>
