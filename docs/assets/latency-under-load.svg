<text x="82" y="356.1" text-anchor="end" font-size="12" fill="#5a5a72">10ms</text>
<line x1="90" y1="282.1" x2="850" y2="282.1" stroke="#e5e5ec"/>
<text x="82" y="286.1" text-anchor="end" font-size="12" fill="#5a5a72">100ms</text>
<line x1="90" y1="212.2" x2="850" y2="212.2" stroke="#e5e5ec"/>
<text x="82" y="216.2" text-anchor="end" font-size="12" fill="#5a5a72">1s</text>
<line x1="90" y1="142.3" x2="850" y2="142.3" stroke="#e5e5ec"/>
<text x="82" y="146.3" text-anchor="end" font-size="12" fill="#5a5a72">10s</text>
