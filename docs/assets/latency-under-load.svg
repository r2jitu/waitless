<svg xmlns="http://www.w3.org/2000/svg" width="900" height="530" viewBox="0 0 900 530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect width="900" height="530" fill="#ffffff"/>
<text x="40" y="40" font-size="20" font-weight="700" fill="#1a1a2e">Tail latency vs. offered load — open-loop (wrk2-style), HTTPS /health</text>
<text x="40" y="63" font-size="13" fill="#5a5a72">Fixed-rate schedule over 4,000 keep-alive TLS conns from two load generators; latency measured from each request's scheduled time</text>
<text x="40" y="80" font-size="13" fill="#5a5a72">(coordinated-omission-corrected). p99 shown.</text>
<line x1="90" y1="380.0" x2="850" y2="380.0" stroke="#e5e5ec"/>
<text x="82" y="384.0" text-anchor="end" font-size="12" fill="#5a5a72">1ms</text>
<line x1="90" y1="310.1" x2="850" y2="310.1" stroke="#e5e5ec"/>
<text x="82" y="314.1" text-anchor="end" font-size="12" fill="#5a5a72">10ms</text>
<line x1="90" y1="240.1" x2="850" y2="240.1" stroke="#e5e5ec"/>
<text x="82" y="244.1" text-anchor="end" font-size="12" fill="#5a5a72">100ms</text>
<line x1="90" y1="170.2" x2="850" y2="170.2" stroke="#e5e5ec"/>
<text x="82" y="174.2" text-anchor="end" font-size="12" fill="#5a5a72">1s</text>
<line x1="90" y1="100.3" x2="850" y2="100.3" stroke="#e5e5ec"/>
<text x="82" y="104.3" text-anchor="end" font-size="12" fill="#5a5a72">10s</text>
<line x1="162.4" y1="380" x2="162.4" y2="385" stroke="#3a3a4a"/>
<text x="162.4" y="400" text-anchor="middle" font-size="12" fill="#5a5a72">100K</text>
<line x1="234.8" y1="380" x2="234.8" y2="385" stroke="#3a3a4a"/>
<text x="234.8" y="400" text-anchor="middle" font-size="12" fill="#5a5a72">200K</text>
<line x1="307.1" y1="380" x2="307.1" y2="385" stroke="#3a3a4a"/>
<text x="307.1" y="400" text-anchor="middle" font-size="12" fill="#5a5a72">300K</text>
<line x1="379.5" y1="380" x2="379.5" y2="385" stroke="#3a3a4a"/>
<text x="379.5" y="400" text-anchor="middle" font-size="12" fill="#5a5a72">400K</text>
<line x1="451.9" y1="380" x2="451.9" y2="385" stroke="#3a3a4a"/>
<text x="451.9" y="400" text-anchor="middle" font-size="12" fill="#5a5a72">500K</text>
<line x1="524.3" y1="380" x2="524.3" y2="385" stroke="#3a3a4a"/>
<text x="524.3" y="400" text-anchor="middle" font-size="12" fill="#5a5a72">600K</text>
<line x1="596.7" y1="380" x2="596.7" y2="385" stroke="#3a3a4a"/>
<text x="596.7" y="400" text-anchor="middle" font-size="12" fill="#5a5a72">700K</text>
<line x1="669.0" y1="380" x2="669.0" y2="385" stroke="#3a3a4a"/>
<text x="669.0" y="400" text-anchor="middle" font-size="12" fill="#5a5a72">800K</text>
<line x1="741.4" y1="380" x2="741.4" y2="385" stroke="#3a3a4a"/>
<text x="741.4" y="400" text-anchor="middle" font-size="12" fill="#5a5a72">900K</text>
<line x1="813.8" y1="380" x2="813.8" y2="385" stroke="#3a3a4a"/>
<text x="813.8" y="400" text-anchor="middle" font-size="12" fill="#5a5a72">1000K</text>
<text x="470.0" y="422" text-anchor="middle" font-size="13" fill="#3a3a4a">offered load (requests / second)</text>
<text x="40" y="88" font-size="13" font-weight="700" fill="#3a3a4a">p99 latency, log scale (lower is better)</text>
<polyline points="162.4,356.0 234.8,352.9 307.1,351.4 379.5,346.9 451.9,345.1 524.3,340.1 596.7,317.7 669.0,307.2 741.4,150.4 813.8,114.6" fill="none" stroke="#1f7a4d" stroke-width="3.5" stroke-linejoin="round"/>
<circle cx="162.4" cy="356.0" r="3.5" fill="#1f7a4d"/>
