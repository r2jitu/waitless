<text x="40" y="560" font-size="12" fill="#5a5a72">Shaded region: a six-loadgen rig whose aggregate req/s is client-limited — heights there are lower bounds; connection counts are</text>
<text x="40" y="578" font-size="12" fill="#5a5a72">exact. Hollow circles: all connections established. X: the target never fully established — tokio-hyper reached 190 K of 200 K</text>
<text x="40" y="596" font-size="12" fill="#5a5a72">(112 K socket errors) and collapsed at 240 K (peaked at 92 K, then declined; 492 req/s). Waitless held 240,001 live, stable for</text>
<text x="40" y="614" font-size="12" fill="#5a5a72">4 minutes (280 K = its 16 GB heap edge).</text>
<text x="40" y="632" font-size="12" fill="#5a5a72">SPOT hardware: ~15–20% run-to-run variance — ratios are the robust result. Points ≥40 K use longer windows + patient client</text>
<text x="40" y="650" font-size="12" fill="#5a5a72">timeouts (TLS establishment storm). At saturation (≥16 K) Waitless p99 tails trail tokio-hyper in places — full percentiles in</text>
<text x="40" y="668" font-size="12" fill="#5a5a72">docs/benchmark-results.md; raw data in docs/assets/bench-2026-06-11/.</text>
