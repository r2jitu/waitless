<text x="470.0" y="532" text-anchor="middle" font-size="13" fill="#3a3a4a">concurrent connections (log scale)</text>
<text x="40" y="560" font-size="12" fill="#5a5a72">At 80,000 connections tokio-hyper could not establish them all (59,607 live, 27 K connect errors); Waitless held 80,001 live at</text>
<text x="40" y="578" font-size="12" fill="#5a5a72">497 K req/s. Pushed further with a third load generator, Waitless served 143,164 live TLS connections at ~700 K req/s — the load</text>
<text x="40" y="596" font-size="12" fill="#5a5a72">generators ran out before the server did.</text>
<text x="40" y="614" font-size="12" fill="#5a5a72">SPOT hardware: ~15–20% run-to-run variance — the ratios are the robust result. Points ≥40 K use a 75 s window + 30 s client</text>
<text x="40" y="632" font-size="12" fill="#5a5a72">timeout (TLS establishment storm). At saturation (≥16 K) Waitless p99 tails trail tokio-hyper in places — full percentiles and</text>
<text x="40" y="650" font-size="12" fill="#5a5a72">method in docs/benchmark-results.md; raw data in docs/assets/bench-2026-06-11/.</text>
