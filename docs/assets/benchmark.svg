<text x="40" y="656" font-size="12" fill="#5a5a72">Hollow markers: the offered connections did not all establish or req/s is client-limited. tokio-hyper ends at 80 K (59,607</text>
<text x="40" y="674" font-size="12" fill="#5a5a72">live); Waitless continues to 240,000 live on a six-loadgen rig where req/s is a lower bound — the connection counts are exact.</text>
<text x="40" y="692" font-size="12" fill="#5a5a72">Latency panel covers the matched-rig range.</text>
<text x="40" y="710" font-size="12" fill="#5a5a72">SPOT hardware: ~15–20% run-to-run variance — ratios are the robust result. Points ≥40 K use a 75 s window + 30 s client timeout.</text>
<text x="40" y="728" font-size="12" fill="#5a5a72">At saturation (≥16 K) Waitless p99 tails trail tokio-hyper in places — full percentiles in docs/benchmark-results.md; raw data</text>
<text x="40" y="746" font-size="12" fill="#5a5a72">in docs/assets/bench-2026-06-11/.</text>
