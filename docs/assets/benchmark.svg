<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>

  <text x="40" y="40" font-size="20" font-weight="700" fill="#1a1a2e">HTTPS on one 8-vCPU GCE c3 VM — Waitless vs tokio-hyper</text>
  <text x="40" y="63" font-size="13" fill="#5a5a72">Byte-identical <tspan font-family="ui-monospace,Menlo,monospace">/health</tspan> over TLS 1.3, same gVNIC, same load generators, measured back-to-back.</text>

  <!-- throughput bars -->
  <text x="40" y="104" font-size="13" font-weight="700" fill="#3a3a4a">Requests / second  (higher is better)</text>

  <!-- scale: 0..1.2M over 660px starting x=210 -->
  <!-- Waitless: 1.13M -->
  <text x="40" y="142" font-size="14" font-weight="700" fill="#1f7a4d">Waitless</text>
  <rect x="210" y="124" width="621" height="26" rx="4" fill="#1f7a4d"/>
  <text x="824" y="142" text-anchor="end" font-size="14" font-weight="700" fill="#ffffff">1.13M rps</text>

  <!-- tokio-hyper: 0.59M -->
  <text x="40" y="184" font-size="14" font-weight="700" fill="#7a7a8c">tokio-hyper</text>
  <rect x="210" y="166" width="325" height="26" rx="4" fill="#b8bcc8"/>
  <text x="545" y="184" font-size="14" font-weight="700" fill="#5a5a72">0.59M rps</text>

  <text x="824" y="210" text-anchor="end" font-size="13" font-weight="700" fill="#1f7a4d">≈ 1.9× the throughput</text>

  <!-- latency -->
  <line x1="40" y1="236" x2="860" y2="236" stroke="#e5e5ec" stroke-width="1"/>
  <text x="40" y="266" font-size="13" font-weight="700" fill="#3a3a4a">Median latency under that load  (lower is better)</text>

  <text x="40" y="300" font-size="14" font-weight="700" fill="#1f7a4d">Waitless</text>
  <rect x="210" y="284" width="120" height="22" rx="4" fill="#1f7a4d"/>
  <text x="340" y="300" font-size="13" font-weight="700" fill="#1f7a4d">283 µs</text>

  <text x="40" y="336" font-size="14" font-weight="700" fill="#7a7a8c">tokio-hyper</text>
  <rect x="210" y="320" width="273" height="22" rx="4" fill="#b8bcc8"/>
  <text x="493" y="336" font-size="13" font-weight="700" fill="#5a5a72">644 µs</text>

  <text x="824" y="336" text-anchor="end" font-size="13" font-weight="700" fill="#1f7a4d">≈ 2.3× lower</text>

  <!-- footnote -->
  <text x="40" y="384" font-size="12" fill="#5a5a72">Plain HTTP, same VM: <tspan font-weight="700" fill="#3a3a4a">0.86M</tspan> vs 0.63M rps.  Waitless runs a from-scratch gVNIC driver; Linux runs its mature in-tree one.</text>
  <text x="40" y="404" font-size="12" fill="#8a8a9a">SPOT hardware carries ~15–20% run-to-run variance; the ratios are the robust result. Full method + the concurrency curve: docs/benchmark-results.md</text>
</svg>
