<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="960" height="560" fill="#ffffff"/>

  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a2e">Why a unikernel wins the proxy / async-handler workload</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#5a5a72">A handler that calls a database or another service crosses the kernel boundary on <tspan font-weight="700">both</tspan> legs — Waitless has no boundary to cross.</text>

  <!-- ============ LEFT: typical Linux server ============ -->
  <text x="245" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#b3261e">Typical Linux async server (tokio / nginx / Go)</text>

  <!-- user space box -->
  <rect x="40" y="108" width="410" height="116" rx="8" fill="#fdecea" stroke="#e0b4ae" stroke-width="1.5"/>
  <text x="56" y="128" font-size="11.5" font-weight="700" fill="#8a2a22" letter-spacing="0.5">USER SPACE · ring 3</text>
  <rect x="58" y="140" width="374" height="34" rx="5" fill="#ffffff" stroke="#e0b4ae"/>
  <text x="245" y="162" text-anchor="middle" font-size="13" fill="#3a3a4a">request handler — <tspan font-style="italic">fetch from backend</tspan></text>
  <rect x="58" y="182" width="374" height="34" rx="5" fill="#ffffff" stroke="#e0b4ae"/>
  <text x="245" y="204" text-anchor="middle" font-size="13" fill="#3a3a4a">async runtime · TLS · HTTP (libraries)</text>

  <!-- syscall boundary -->
  <line x1="40" y1="250" x2="450" y2="250" stroke="#b3261e" stroke-width="3" stroke-dasharray="9 6"/>
  <text x="245" y="244" text-anchor="middle" font-size="12" font-weight="700" fill="#b3261e">syscall boundary — copy · context switch · ring transition</text>

  <!-- kernel box -->
  <rect x="40" y="262" width="410" height="158" rx="8" fill="#eaf0fb" stroke="#aebfdf" stroke-width="1.5"/>
  <text x="56" y="282" font-size="11.5" font-weight="700" fill="#274472" letter-spacing="0.5">KERNEL · ring 0</text>
  <rect x="58" y="292" width="374" height="34" rx="5" fill="#ffffff" stroke="#aebfdf"/>
  <text x="245" y="314" text-anchor="middle" font-size="13" fill="#3a3a4a">in-kernel TCP/IP stack</text>
  <rect x="58" y="332" width="374" height="34" rx="5" fill="#ffffff" stroke="#aebfdf"/>
  <text x="245" y="354" text-anchor="middle" font-size="13" fill="#3a3a4a">NIC driver</text>
  <rect x="58" y="372" width="374" height="36" rx="5" fill="#dfe7f5" stroke="#aebfdf"/>
  <text x="245" y="394" text-anchor="middle" font-size="12.5" fill="#274472" font-weight="600">NIC (rx / tx queues)</text>

  <!-- inbound + outbound crossing arrows through the boundary -->
  <g stroke="#b3261e" stroke-width="2" fill="none">
    <path d="M 112 224 L 112 260" marker-end="url(#redarrow)"/>
    <path d="M 152 260 L 152 224" marker-end="url(#redarrow)"/>
    <path d="M 338 224 L 338 260" marker-end="url(#redarrow)"/>
    <path d="M 378 260 L 378 224" marker-end="url(#redarrow)"/>
  </g>

  <!-- ============ RIGHT: Waitless ============ -->
  <text x="715" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#1f7a4d">Waitless unikernel</text>

  <rect x="510" y="108" width="410" height="312" rx="8" fill="#e9f6ee" stroke="#9ed3b4" stroke-width="1.5"/>
  <text x="526" y="128" font-size="11.5" font-weight="700" fill="#1f7a4d" letter-spacing="0.5">ONE ADDRESS SPACE · ONE PRIVILEGE LEVEL</text>

  <rect x="528" y="172" width="374" height="34" rx="5" fill="#ffffff" stroke="#9ed3b4"/>
  <text x="715" y="194" text-anchor="middle" font-size="13" fill="#3a3a4a">request handler — <tspan font-style="italic">fetch from backend</tspan></text>
  <rect x="528" y="212" width="374" height="34" rx="5" fill="#ffffff" stroke="#9ed3b4"/>
  <text x="715" y="234" text-anchor="middle" font-size="13" fill="#3a3a4a">HTTP/1.1 · h2 · h3 — server <tspan font-weight="700">and</tspan> client</text>
  <rect x="528" y="252" width="374" height="34" rx="5" fill="#ffffff" stroke="#9ed3b4"/>
  <text x="715" y="274" text-anchor="middle" font-size="13" fill="#3a3a4a">TLS 1.3 · QUIC</text>
  <rect x="528" y="292" width="374" height="34" rx="5" fill="#ffffff" stroke="#9ed3b4"/>
  <text x="715" y="314" text-anchor="middle" font-size="13" fill="#3a3a4a">TCP / UDP / IP · async executor (the scheduler)</text>
  <rect x="528" y="332" width="374" height="34" rx="5" fill="#ffffff" stroke="#9ed3b4"/>
  <text x="715" y="354" text-anchor="middle" font-size="13" fill="#3a3a4a">NIC driver (polls the queues directly)</text>
  <rect x="528" y="372" width="374" height="36" rx="5" fill="#d6efe0" stroke="#9ed3b4"/>
  <text x="715" y="394" text-anchor="middle" font-size="12.5" fill="#1f7a4d" font-weight="600">NIC (rx / tx queues)</text>

  <!-- shared hardware baseline guide: NICs aligned at y=372 in both columns -->

  <!-- ============ captions ============ -->
  <text x="245" y="452" text-anchor="middle" font-size="11" fill="#b3261e">inbound serve <tspan fill="#8a2a22">(recv · send · accept)</tspan>  +  outbound fetch <tspan fill="#8a2a22">(connect · send · recv · close)</tspan></text>
  <text x="245" y="480" text-anchor="middle" font-size="13" font-weight="700" fill="#b3261e">~61% of CPU spent in the kernel at saturation</text>
  <text x="245" y="500" text-anchor="middle" font-size="11.5" fill="#5a5a72">a proxy crosses the boundary on every leg — the tax is paid twice</text>

  <text x="715" y="452" text-anchor="middle" font-size="11.5" fill="#1f7a4d" font-weight="600">every layer is a direct function call — no syscall, no copy</text>
  <text x="715" y="480" text-anchor="middle" font-size="13" font-weight="700" fill="#1f7a4d">inbound serve and outbound fetch share one event loop</text>
  <text x="715" y="500" text-anchor="middle" font-size="11.5" fill="#5a5a72">measured: ~2× the requests/sec of tokio-hyper on identical GCE hardware</text>

  <defs>
    <marker id="redarrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b3261e"/>
    </marker>
  </defs>
</svg>
