# nginx peer config — high-concurrency keep-alive, kTLS on HTTPS,
# minimal logging in the hot path. Tuned to be a "best honest effort"
# baseline for the waitless Pareto-frontier bench. Reviewers should be
# able to point at any directive here and either understand why it's
# set the way it is or propose a tighter setting.

# `www-data` is Debian's standard nginx/web user. The parity
# Dockerfile (which uses the nginx.org base image with a `nginx`
# user) creates www-data at build time so the same config works both
# on the GCE peer VM (apt install nginx) and in the Docker image.
user www-data;
# Match worker count to vCPU count at runtime. `auto` reads
# /proc/cpuinfo at start — pins one worker per vCPU.
worker_processes auto;

# Per-worker fd limit. nginx's per-conn cost is one fd; at 65535
# worker_connections × N workers we need at least N × 65535 fds. Set
# generously here and pair with `LimitNOFILE` in the systemd unit /
# `--ulimit nofile` in `docker run`.
worker_rlimit_nofile 1048576;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 65535;
    # Accept as many new conns as the listen backlog has queued in one
    # accept() loop iter, rather than one per loop. Material at high
    # accept rates (the get_tcp_fresh / tls_handshake workloads).
    multi_accept on;
    use epoll;
}

http {
    # No mime.types — the only Content-Types we emit are wired into
    # the location blocks below (application/json,
    # application/octet-stream). Skipping the mime.types parse keeps
    # the per-request `index` lookup off the hot path.
    default_type application/octet-stream;

    # Hot-path-cost log line — disable for the bench. Reviewer
    # mitigation: a one-line `access_log /dev/null;` is the standard
    # nginx bench tuning; if anyone objects, flip to
    # `access_log /var/log/nginx/access.log combined buffer=64k flush=5s;`
    # and the numbers move by single-digit percent at /health rates.
    access_log off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;

    # Keep-alive: hold idle conns up to 75s (waitless's default is
    # similar), allow up to 100K req per conn before forced close.
    keepalive_timeout 75;
    keepalive_requests 100000;

    # Worker conn header cap. nginx's default 4k client_header_buffer
    # is fine for our trivial requests.

    # ── TLS 1.3, kTLS-enabled ────────────────────────────────────
    # ssl_conf_command Options KTLS enables kernel-TLS offload on
    # Linux 5.x+ with OpenSSL 3.0+. This is the directive that makes
    # nginx a fair fight against waitless's hand-rolled TLS — without
    # it, every record traverses userland AES.
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    # TLS 1.3 cipher suites — match what waitless negotiates
    # (TLS_AES_128_GCM_SHA256 per CLAUDE.md).
    ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256;
    ssl_conf_command Options KTLS;
    ssl_session_cache shared:SSL:64m;
    ssl_session_timeout 10m;
    # No session tickets for now — waitless's resumption path is
    # PSK-DHE-only (project_tls_server). Apples-to-apples means
    # neither side advertises tickets in the default bench.
    ssl_session_tickets off;

    # ── Upstream: tokio-hyper sidecar for /compute and /discard ──
    # nginx doesn't run app code, so the dynamic endpoints proxy to
    # the tokio-hyper peer running on the same host. Keep-alive
    # upstream pool so the per-request hop is just a TCP send, not a
    # 3WHS. 0 conns parked initially; grows on demand up to 64.
    upstream tokio_hyper {
        server 127.0.0.1:8080;
        keepalive 64;
    }

    server {
        listen 80 default_server backlog=65535 reuseport;
        listen [::]:80 default_server backlog=65535 reuseport;

        # HTTP/2 enabled via the per-listener flag (works on nginx 1.22
        # Debian-stable through 1.25+ where the standalone `http2 on;`
        # directive replaced it). Keep-alive shape doesn't depend on
        # h2 vs h1.1 for the bench; this is for clients that prefer h2.
        listen 443 ssl http2 default_server backlog=65535 reuseport;
        listen [::]:443 ssl http2 default_server backlog=65535 reuseport;

        ssl_certificate /etc/nginx/tls/dev_cert.pem;
        ssl_certificate_key /etc/nginx/tls/dev_key.pem;

        server_name _;

        # ── Static endpoints (byte-mirror of waitless) ──────────
        location = /health {
            default_type application/json;
            alias /var/www/static/health.json;
        }
        location = /static-16k {
            default_type application/octet-stream;
            alias /var/www/static/static-16k;
        }
        location = /static-64k {
            default_type application/octet-stream;
            alias /var/www/static/static-64k;
        }
        location = /static-256k {
            default_type application/octet-stream;
            alias /var/www/static/static-256k;
        }
        location = /static-1m {
            default_type application/octet-stream;
            alias /var/www/static/static-1m;
        }

        # ── Dynamic endpoints (proxied to tokio-hyper) ─────────
        # /compute and /discard run app code and have no nginx-native
        # equivalent. Forwarding to the tokio-hyper sidecar gives us
        # a number that represents the realistic "nginx in front of an
        # app server" deploy shape rather than a pure-nginx fiction.
        location = /compute {
            proxy_pass http://tokio_hyper;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
        }
        location = /discard {
            proxy_pass http://tokio_hyper;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_buffering off;
            client_max_body_size 16m;
        }

        location / {
            return 404;
        }
    }
}
