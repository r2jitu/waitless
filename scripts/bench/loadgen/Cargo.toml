[package]
name = "loadgen"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "Async TCP/TLS load generator for the unikernel benchmark suite"
publish = false

[[bin]]
name = "loadgen"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hdrhistogram = "7"

# Single-purpose tool: small + fast, abort on panic.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.dev]
panic = "abort"
