# Workspace root for the project's host-buildable Rust code.
#
# crate_universe (in MODULE.bazel) reads this workspace + its members
# and generates `@crates//:foo` labels for every external dep. Members:
#
#   tools/hvf-runner    — host binary, real cargo build target
#   bazel/crates-bridge — placeholder; pulls bare-metal-only crates
#                         (bitflags, fdt, limine) into the spliced
#                         lockfile so the kernel/uni rust_library
#                         targets can reference them via @crates//:.
#                         Never built by bazel or cargo directly.
#
# The bare-metal kernel/uni/etc. rust_library targets are NOT in this
# workspace because they target `aarch64-unknown-none` / `x86_64-
# unknown-none`, are `#![no_std]`, and use bazel-only build flags
# that don't fit cleanly in Cargo.toml. They link against `@crates//`
# labels generated by crate_universe via the bridge crate above.

[workspace]
resolver = "2"
members = [
    "tools/hvf-runner",
    "bazel/crates-bridge",
]

[workspace.dependencies]
# Used by tools/hvf-runner.
libc = "0.2"
# vm-fdt needs `std` for HashSet (used in writer.rs to dedup phandles).
vm-fdt = "0.3"
# Used by the bare-metal kernel/uni/limine rust_library targets via
# @crates//:bitflags, @crates//:fdt, @crates//:limine. Pinned because:
#   - bitflags 2.x is the modern API the kernel uses
#   - fdt 0.1.5 is the last 0.1.x; 0.2.x changes the parser API
#   - limine 0.5.0 is the last version under the original maintainer;
#     0.6.x needs nightly `ptr_metadata` which we can't use on stable
bitflags = { version = "2", default-features = false }
fdt = { version = "0.1.5", default-features = false }
limine = { version = "0.5.0", default-features = false }

# TLS 1.3 crypto primitives from the RustCrypto project. Pure Rust,
# no_std + alloc compatible. Pulled in via crates-bridge so the
# bare-metal kernel/uni rust_library targets can use them directly.
# Versions chosen to be the latest stable as of 2026-04.
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
hkdf = { version = "0.12", default-features = false }
# Audited AEAD for TLS 1.3 record encryption. We ship the full set
# so rustls / quinn-proto can pick any:
#
# - `aes-gcm` + `polyval` for TLS_AES_128_GCM_SHA256 / _256_
# - `chacha20poly1305` + `poly1305` + `chacha20` for
#   TLS_CHACHA20_POLY1305_SHA256
#
# All of these unconditionally emit `__m128i` / pclmulqdq intrinsic
# code on x86_64 (auto-selected at compile time, runtime-dispatched
# via `cpufeatures`). The stock `x86_64-unknown-none` target spec
# has `+soft-float,-sse` which makes LLVM bail with "Do not know how
# to split the result of this operator!" when it tries to legalise
# those intrinsics without register support. We fix it per-crate in
# MODULE.bazel via a `crate.annotation` that passes
# `-Ctarget-feature=-soft-float,+sse,+sse2,...` — the kernel already
# enables SSE at boot (CR4.OSFXSR) and our cooperative scheduler
# never preempts, so kernel-side SIMD is safe.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# Key exchange: X25519 is the only MTI group for TLS 1.3 and QUIC.
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
# ECDSA verification for P-256 server certificates (common with self-signed
# dev certs).
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8"] }
# Ed25519 signatures for a simpler cert option.
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
# Random: `rand_core` trait + entropy source. We supply our own RNG
# from the kernel (jitter + cycle counter), this is just the trait.
rand_core = { version = "0.6", default-features = false }

# Warnings are errors for every workspace member's cargo-standalone
# build. Bazel builds get the same policy via the `-Dwarnings` flag in
# `.bazelrc`'s `extra_rustc_flags`, so CI and IDE behaviour match.
[workspace.lints.rust]
warnings = "deny"

# Profiles must live at the workspace root, not in member crates.
# Single-purpose, single-process tools — small/fast/abort-on-panic.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.dev]
panic = "abort"
