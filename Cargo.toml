# Workspace root for the project's host-buildable Rust code.
#
# crate_universe (in MODULE.bazel) reads this workspace + its members
# and generates `@crates//:foo` labels for every external dep. Members:
#
#   tools/hvf-runner    — host binary, real cargo build target
#   bazel/crates-bridge — placeholder; pulls bare-metal-only crates
#                         (bitflags, fdt, limine) into the spliced
#                         lockfile so the kernel/uni rust_library
#                         targets can reference them via @crates//:.
#                         Never built by bazel or cargo directly.
#
# The bare-metal kernel/uni/etc. rust_library targets are NOT in this
# workspace because they target `aarch64-unknown-none` / `x86_64-
# unknown-none`, are `#![no_std]`, and use bazel-only build flags
# that don't fit cleanly in Cargo.toml. They link against `@crates//`
# labels generated by crate_universe via the bridge crate above.

[workspace]
resolver = "2"
members = [
    "tools/hvf-runner",
    "bazel/crates-bridge",
]

[workspace.dependencies]
# Used by tools/hvf-runner.
libc = "0.2"
# vm-fdt needs `std` for HashSet (used in writer.rs to dedup phandles).
vm-fdt = "0.3"
# Used by the bare-metal kernel/uni/limine rust_library targets via
# @crates//:bitflags, @crates//:fdt, @crates//:limine. Pinned because:
#   - bitflags 2.x is the modern API the kernel uses
#   - fdt 0.1.5 is the last 0.1.x; 0.2.x changes the parser API
#   - limine 0.5.0 is the last version under the original maintainer;
#     0.6.x needs nightly `ptr_metadata` which we can't use on stable
bitflags = { version = "2.9.1", default-features = false }
fdt = { version = "0.1.5", default-features = false }
limine = { version = "0.5.0", default-features = false }

# Profiles must live at the workspace root, not in member crates.
# Single-purpose, single-process tools — small/fast/abort-on-panic.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.dev]
panic = "abort"
