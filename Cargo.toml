# Workspace root for the project's host-buildable Rust code.
#
# crate_universe (in MODULE.bazel) reads this workspace + its members
# and generates `@crates//:foo` labels for every external dep. Members:
#
#   tools/hvf-runner    — host binary, real cargo build target
#   bazel/crates-bridge — placeholder; pulls bare-metal-only crates
#                         (bitflags, fdt, limine) into the spliced
#                         lockfile so the kernel/uni rust_library
#                         targets can reference them via @crates//:.
#                         Never built by bazel or cargo directly.
#
# The bare-metal kernel/uni/etc. rust_library targets are NOT in this
# workspace because they target `aarch64-unknown-none` / `x86_64-
# unknown-none`, are `#![no_std]`, and use bazel-only build flags
# that don't fit cleanly in Cargo.toml. They link against `@crates//`
# labels generated by crate_universe via the bridge crate above.

[workspace]
resolver = "2"
# `scripts/bench/loadgen` is built via plain cargo (host-native or
# cross-compiled to x86_64-linux), not Bazel — `ring`'s build script
# needs `ar` and the bazel cc_toolchain is rust-link-only. Keeping
# loadgen out of the workspace avoids re-pinning the bazel-side
# crate_universe lockfile when its tokio/rustls deps shift.
members = [
    "tools/hvf-runner",
    "bazel/crates-bridge",
]
exclude = ["scripts/bench/loadgen"]

[workspace.dependencies]
# Used by tools/hvf-runner.
libc = "0.2"
# vm-fdt needs `std` for HashSet (used in writer.rs to dedup phandles).
vm-fdt = "0.3"
# Used by the bare-metal kernel/uni/limine rust_library targets via
# @crates//:bitflags, @crates//:fdt, @crates//:limine. Pinned because:
#   - bitflags 2.x is the modern API the kernel uses
#   - fdt 0.1.5 is the last 0.1.x; 0.2.x changes the parser API
#   - limine 0.5.0 is the last version under the original maintainer;
#     0.6.x needs nightly `ptr_metadata` which we can't use on stable
bitflags = { version = "2", default-features = false }
fdt = { version = "0.1.5", default-features = false }
limine = { version = "0.5.0", default-features = false }

# TLS 1.3 crypto primitives from the RustCrypto project. Pure Rust,
# no_std + alloc compatible. Pulled in via crates-bridge so the
# bare-metal kernel/uni rust_library targets can use them directly.
#
# Design note (2026-04-14): we DELIBERATELY do NOT use `rustls` +
# `rustls-rustcrypto` despite them building for our target. Reasons:
#
#   - rustls forces every handshake message through `Vec<u8>` and
#     wraps connection state in `Arc<ServerConfig>` / `Arc<dyn
#     ResolvesServerCert>` / ... Our kernel heap isn't slabbed and our
#     per-core model doesn't need atomic refcounts. The
#     allocation-plus-vtable overhead is pure cost.
#   - `rustls-rustcrypto 0.0.2-alpha` is explicitly marked
#     "DO NOT USE IN PRODUCTION" by upstream.
#   - QUIC's packet protection bypasses rustls's record layer anyway;
#     wiring rustls now means half-in-half-out when we get to QUIC.
#
# Instead we use the audited RustCrypto *primitives* directly and
# build our own TLS 1.3 handshake + record layer in `//net:tls_*`.
# Everything the crypto audit cares about (AEAD / HKDF / signatures /
# kx) comes from RustCrypto; the TLS state machine is protocol logic
# we own, with RFC 8448 test vectors for correctness.
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
hkdf = { version = "0.12", default-features = false }
# Audited AEAD for TLS 1.3 record encryption.
#   - aes-gcm + polyval for TLS_AES_128_GCM_SHA256 / _256_ (future)
#   - chacha20poly1305 + poly1305 + chacha20 for our MTI suite,
#     TLS_CHACHA20_POLY1305_SHA256.
#
# Every RustCrypto AEAD auto-compiles both a SIMD intrinsic path AND
# a software path, dispatched at runtime via `cpufeatures`, so BOTH
# must compile. The stock `x86_64-unknown-none` target has
# `+soft-float,-sse` baked in and LLVM bails with "Do not know how
# to split the result of this operator!" (rust-lang/rust#87642,
# #92760). Fixed per-crate in MODULE.bazel via `crate.annotation`
# with `-Ctarget-feature=-soft-float,+sse,+sse2,...`. The kernel
# already enables SSE at boot (CR4.OSFXSR) and our cooperative
# scheduler never preempts, so kernel-side SIMD is safe.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# Direct dep on the chacha20 stream cipher so `kernel::rng` can use
# it as the expander for its seed-derived keystream RNG. Pulled in
# transitively by chacha20poly1305 anyway, but listing it explicitly
# gives us a top-level `@crates//:chacha20` Bazel label. Also used
# by `uni-tls`'s `aead.rs` for the scatter-gather seal path —
# encrypts split body+trailer buffers in place with one ChaCha20
# keystream pass.
chacha20 = { version = "0.9", default-features = false, features = ["zeroize"] }
# Audited Poly1305 MAC. Pulled in transitively by chacha20poly1305
# (which uses it to compute the AEAD tag); listed explicitly so
# `uni-tls`'s scatter-gather seal path can drive it directly
# (block-by-block update over body+trailer + manual padding).
poly1305 = { version = "0.8", default-features = false }
# Key exchange: X25519 is the only MTI group for TLS 1.3 and QUIC.
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
# ECDSA P-256 + SHA-256 — the signature algorithm our TLS 1.3 server
# uses for CertVerify. Picked over ed25519 because Chromium-family
# browsers (Chrome, Arc, Edge, ...) and macOS LibreSSL don't support
# ed25519 for server auth; ECDSA P-256 is universally supported.
# `ecdsa` feature brings in the signing primitive; we hand-roll the
# PKCS#8 extraction so we don't need the `pkcs8` feature.
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
# Random: `rand_core` trait. Actual entropy comes from `kernel::rng`.
rand_core = { version = "0.6", default-features = false }

# `getrandom` 0.2.x is pulled in transitively by rand_core /
# curve25519-dalek. Bare-metal targets aren't on its supported list
# so we enable the `custom` backend feature and register our callback
# via `kernel::rng::register_custom_getrandom!`.
getrandom = { version = "0.2", default-features = false, features = ["custom"] }

# Kernel heap allocator. `talc` is a no_std segregated-free-list
# allocator with O(log n) alloc/free and honest arbitrary-alignment
# support. Replaces the hand-rolled first-fit + O(n) coalescing
# allocator that previously lived in `kernel/mm.rs`.
#
# We wrap it in our own `Spinlock<Talc<ErrOnOom>>` rather than using
# `Talck<spin::Mutex<...>, ...>` so we don't pull the `spin` crate
# into the kernel — the kernel already has a battle-tested spinlock.
#
# `counters` exposes used/free byte counters for `/heap` observability
# without requiring a second pass over the free list at query time.
talc = { version = "4", default-features = false, features = ["counters"] }

# Warnings are errors for every workspace member's cargo-standalone
# build. Bazel builds get the same policy via the `-Dwarnings` flag in
# `.bazelrc`'s `extra_rustc_flags`, so CI and IDE behaviour match.
[workspace.lints.rust]
warnings = "deny"

# Profiles must live at the workspace root, not in member crates.
# Single-purpose, single-process tools — small/fast/abort-on-panic.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.dev]
panic = "abort"
