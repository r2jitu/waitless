[package]
name = "hvf-runner"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "Apple Hypervisor.framework runner for a bare-metal aarch64 unikernel"
publish = false

[[bin]]
name = "run-hvf"
path = "src/main.rs"

[dependencies]
libc = { workspace = true }
vm-fdt = { workspace = true }

# `[profile.*]` lives in the workspace root Cargo.toml — it would
# only be ignored here.
