# Placeholder workspace member.
#
# The bare-metal kernel/uni/limine rust_library targets aren't
# cargo-aware (they're `#![no_std]`, target `*-unknown-none`, and
# build with bazel-only flags). To make crate_universe aware of the
# external crates they need, this stub lists the deps as a workspace
# member, which forces them into the spliced Cargo.lock so the
# `@crates//:bitflags` / `@crates//:fdt` / `@crates//:limine` labels
# get generated.
#
# This crate is never compiled by bazel or cargo at runtime — its
# only purpose is dependency registration for crate_universe.

[package]
name = "crates-bridge"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
bitflags = { workspace = true }
fdt = { workspace = true }
limine = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hkdf = { workspace = true }
aes-gcm = { workspace = true }
# `chacha20` retained for `kernel::rng` (CSPRNG expander). TLS / QUIC
# AEAD paths are AES-128-GCM only post-migration; `chacha20poly1305`
# and `poly1305` are no longer pulled in from this bridge.
chacha20 = { workspace = true }
x25519-dalek = { workspace = true }
p256 = { workspace = true }
rand_core = { workspace = true }
getrandom = { workspace = true }
talc = { workspace = true }
