                "BUILD.bazel": "###############################################################################\n# @generated\n# DO NOT MODIFY: This file is auto-generated by a crate_universe tool. To \n# regenerate this file, run the following:\n#\n#     bazel mod show_repo 'waitless'\n###############################################################################\n\npackage(default_visibility = [\"//visibility:public\"])\n\nexports_files(\n    [\n        \"cargo-bazel.json\",\n        \"crates.bzl\",\n        \"defs.bzl\",\n    ] + glob(\n        allow_empty = True,\n        include = [\"*.bazel\"],\n    ),\n)\n\nfilegroup(\n    name = \"srcs\",\n    srcs = glob(\n        allow_empty = True,\n        include = [\n            \"*.bazel\",\n            \"*.bzl\",\n        ],\n    ),\n)\n\n# Workspace Member Dependencies\nalias(\n    name = \"aes-0.8.4\",\n    actual = \"@crates__aes-0.8.4//:aes\",\n    tags = [\"manual\"],\n)\n\nalias(\n    name = \"aes\",\n    actual = \"@crates__aes-0.8.4//:aes\",\n    tags = [\"manual\"],\n)\n\nalias(\n    name = \"aes-gcm-0.10.3\",\n    actual = \"@crates__aes-gcm-0.10.3//:aes_gcm\",\n    tags = [\"manual\"],\n)\n\nalias(\n    name = \"aes-gcm\",\n    actual = \"@crates__aes-gcm-0.10.3//:aes_gcm\",\n    tags = [\"manual\"],\n)\n\nalias(\n    name = \"bitflags-2.11.0\",\n    actual = \"@crates__bitflags-2.11.0//:bitflags\",\n    tags = [\"manual\"],\n)\n\nalias(\n    name = \"bitflags\",\n    actual = \"@crates__bitflags-2.11.0//:bitflags\",\n    tags = [\"manual\"],\n)\n\nalias(\n    name = \"fdt-0.1.5\",\n    actual = \"@crates__fdt-0.1.5//:fdt\",\n    tags = [\"manual\"],\n)\n\nalias(\n    name = \"fdt\",\n    actual = \"@crates__fdt-0.1.5//:fdt\",\n    tags = [\"manual\"],\n)\n\nalias(\n    name = \"getrandom-0.2.17\",\n    actual = \"@crates__getrandom-0.2.17//:getrandom\",\n    tags = [\"manual\"],\n)\n\nalias(\n    name = \"getrandom\",\n    actual = \"@crates__getrandom-0.2.17//:getrandom\",\n    tags = [\"manual\"],\n)\n